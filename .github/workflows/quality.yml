name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Python 3.12 quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      PYTHONWARNINGS: error
      # Server of the database tests (migrations on existing data, price storage,
      # cleanup): each run creates and drops its own database on it. Without this
      # variable those tests are skipped, and the gate proves nothing about SQL
      # that only PostgreSQL and TimescaleDB can run.
      FONREX_TEST_DATABASE_URL: postgresql://fonrex:fonrex_password@127.0.0.1:5432/postgres

    services:
      # The image of docker-compose.yml: the tests run on what an installation runs
      # (tests/test_ci_workflow.py keeps the two files in step).
      timescaledb:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_USER: fonrex
          POSTGRES_PASSWORD: fonrex_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # Over TCP: during its initialisation the server only answers on its
        # socket, then restarts. The steps start once this check passes.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U fonrex -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      # The exact versions of the lock file, each checked against its hash:
      # the gate tests the same packages as the Docker image installs.
      - name: Install locked development dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock

      - name: Run quality gate
        run: make ci PYTHON=python

      # Shown on the run page, reachable from the "Checks" tab of the pull request.
      - name: Publish coverage summary
        if: always() && hashFiles('coverage.json') != ''
        run: python scripts/check_coverage_distribution.py coverage.json --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
