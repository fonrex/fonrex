[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    ".venv",
    "data",
    "node_modules",
    "scratch",
    "venv",
]

[tool.ruff.lint]
# Strict progressive baseline: syntax and style errors, complete Pyflakes,
# deterministic imports, exception chaining and selected safe modernizations.
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "B904",
    "B905",
    "UP015",
    "UP037",
    "UP041",
    "SIM114",
    "RUF100",
]

[tool.ruff.lint.per-file-ignores]
# These bootstrap files deliberately mutate sys.path before importing the app.
"scripts/*.py" = ["E402"]
"tests/test_migrations.py" = ["E402"]

# `l` is the public low-price field in the compact OHLCV wire contract.
"schemas/technical.py" = ["E741"]

[tool.mypy]
# `make typecheck` checks the typed boundaries (TYPED_BOUNDARIES in the Makefile)
# in strict mode. The modules they import are read for their types without being
# reported: a module is typed by adding it to TYPED_BOUNDARIES, never removed.
python_version = "3.12"
strict = true
follow_imports = "silent"
# The repository root holds an __init__.py: without these two settings mypy names
# a module both `use_cases.errors` and `fonrex.use_cases.errors`. Modules are
# named from the root, as the application imports them.
mypy_path = "$MYPY_CONFIG_FILE_DIR"
explicit_package_bases = true

# Libraries without type information, read as untyped. pandas-stubs is not
# installed yet: it would type the index labels of a DataFrame as Hashable.
[[tool.mypy.overrides]]
module = ["pandas", "pandas.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["."]
omit = [
    ".venv/*",
    "alembic/*",
    "data/*",
    "scratch/*",
    "scripts/*",
    "tests/*",
    "venv/*",
]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.coverage.xml]
output = "coverage.xml"

[tool.uv]
# The lock files (`make lock`) are resolved for the Python versions the project
# runs on: 3.12 (Docker image, CI) and 3.13, on every platform.
environments = ["python_version >= '3.12' and python_version < '3.14'"]
