[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    "data",
    "node_modules",
    "scratch",
    "venv",
]

[tool.ruff.lint]
# Strict progressive baseline: syntax and style errors, complete Pyflakes,
# deterministic imports, exception chaining and selected safe modernizations.
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "B904",
    "B905",
    "UP015",
    "UP037",
    "UP041",
    "SIM114",
    "RUF100",
]

[tool.ruff.lint.per-file-ignores]
# These bootstrap files deliberately mutate sys.path before importing the app.
"scripts/*.py" = ["E402"]
"tests/debug_db_asset.py" = ["E402"]
"tests/test_migrations.py" = ["E402"]
"tests/verify_asset_mapping.py" = ["E402"]

# `l` is the public low-price field in the compact OHLCV wire contract.
"schemas/technical.py" = ["E741"]

[tool.coverage.run]
branch = true
source = ["."]
omit = [
    "alembic/*",
    "data/*",
    "scratch/*",
    "scripts/*",
    "tests/*",
    "venv/*",
]

[tool.coverage.report]
fail_under = 54
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.coverage.xml]
output = "coverage.xml"
