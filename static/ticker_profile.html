<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Ticker Profile</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #121214;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .tradingview-widget-container {
      width: 100%;
      height: 100%;
    }
    .tradingview-widget-container__widget {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="widget-container" class="tradingview-widget-container">
    <div class="tradingview-widget-container__widget"></div>
  </div>

  <script>
    function getTvSymbol(raw) {
      if (!raw) return "NASDAQ:AAPL";
      raw = raw.trim().toUpperCase();
      if (raw.includes(":")) return raw;
      if (raw.endsWith(".PA")) return "EURONEXT:" + raw.replace(".PA", "");
      if (raw.endsWith(".MC")) return "BME:" + raw.replace(".MC", "");
      if (raw.endsWith(".DE")) return "XETR:" + raw.replace(".DE", "");
      if (raw.endsWith(".L")) return "LSE:" + raw.replace(".L", "");
      return raw;
    }

    const urlParams = new URLSearchParams(window.location.search);
    const ticker = urlParams.get('ticker') || urlParams.get('symbol') || 'AAPL';
    const tvSymbol = getTvSymbol(ticker);

    const script = document.createElement('script');
    script.type = 'text/javascript';
    script.src = 'https://s3.tradingview.com/external-embedding/embed-widget-symbol-profile.js';
    script.async = true;
    script.innerHTML = JSON.stringify({
      "symbol": tvSymbol,
      "width": "100%",
      "height": "100%",
      "colorTheme": "dark",
      "isTransparent": true,
      "locale": "en"
    });

    document.getElementById('widget-container').appendChild(script);
  </script>
</body>
</html>
